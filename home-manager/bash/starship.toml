format = """
[](#3B4252)\
$directory\
[](fg:#3B4252 bg:#0F5880)\
$nix_shell\
[](fg:#0F5880 bg:#0c6da3)\
$git_branch\
[](fg:#0c6da3 bg:#0d77b1)\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
[](fg:#0d77b1 bg:#0EA16F)\
$docker_context\
[](fg:#0EA16F bg:#03883b)\
$time\
[ ](fg:#03883b)\
\n[  󱞩 ](fg:#FFFFFF)\
"""
command_timeout = 5000
# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bg:#3B4252"
style_root = "bg:#DF2500"
format = '[]($style)'

[nix_shell]
disabled = false
format = '[ 󰗀  ](white bg:#0F5880)'

[directory]
style = "bg:#3B4252"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"codeProjects-Git" = " "
"codeProjects-Local" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[c]
symbol = " "
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#0EA16F"
format = '[ $symbol $context ]($style) $path'

[elixir]
symbol = ""
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[git_branch]
style = "bg:#0c6da3"
format = '[ $branch ]($style)'

[golang]
symbol = " "
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = "󰬷 "
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = "󰰇 "
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[python]
style = "bg:#3B4252"
format = '[(\($virtualenv\) )]($style)'

[rust]
symbol = "󱘗"
style = "bg:#0D77B1"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute:Sec Format
style = "bg:#03883b fg:#ffffff"
format = '[ $time ]($style)'
