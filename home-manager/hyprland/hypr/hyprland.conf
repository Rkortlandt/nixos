# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,highres,0x0,2
monitor=DP-3,1920x1080,auto-right,1
xwayland {
  force_zero_scaling = true
}

env = GDK_SCALE,1.2
# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once = ~/nixos/home-manager/agsbar/result/bin/agsbar
exec-once = hypridle
exec-once = swaybg -m fill -i ~/nixos/home-manager/hyprland/hypr/Wallpapers/pie.jpg
exec-once = wl-paste --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = kwalletd6
exec-once = pam_kwallet_init
exec-once = ~/nixos/home-manager/hyprland/hypr/scripts/refresh-rate.sh auto
# Some default env vars.

env = XCURSOR_SIZE,24

windowrule = match:title ^(Bitwarden - Vivaldi)$, float on
windowrule = match:title ^(Bitwarden - Vivaldi)$, size 622 652
windowrule = match:title ^(Save File)$, size 800 600
windowrule = match:title ^(Save Files)$, size 800 600
windowrule = match:title ^(Open File)$, size 800 600
windowrule = match:title ^(Open Files)$, size 800 600
windowrule = match:title ^(Choose Symbol.*)$, size 1000 600
windowrule = match:class ^(clipse)$, float on
windowrule = match:class ^(clipse)$, size 622 652
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, size 800 600
windowrule = match:class ^(nemo)$, float on
windowrule = match:class ^(nemo)$, move 25 52
windowrule = match:class ^(nemo)$, size 1100 512
windowrule = match:initial_title ^(Write: \(no subject\))$, float on
windowrule = match:initial_title ^(Write: \(no subject\))$, size 1093 608
windowrule = match:initial_title ^(Write: \(no subject\))$, move 29 100

workspace = special:music, on-created-empty:spotify
workspace = special:slack, on-created-empty:slack
workspace = special:email, on-created-empty:thunderbird
workspace = special:todo, on-created-empty:kitty -e task
workspace = special:discord, on-created-empty:discord --enable-features=UseOzonePlatform --ozone-platform=wayland

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_options = caps:escape
    
    follow_mouse = 1

    touchpad {
        natural_scroll = no
        scroll_factor = .2
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    resize_on_border = true
    gaps_in = 5
    gaps_out = 5
    border_size = 1
    col.active_border = rgba(172A7Daa) rgba(0FD461aa) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
   # allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 7
    shadow {
     enabled= yes
     color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = specialWorkspace, 1, 3, default, slidevert
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
}

gesture = 3, horizontal, workspace

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
}



# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = SUPER, B, exec, kitty --class clipse -e clipse
bind = SUPER, Q, exec, kitty
bind = SUPER, V, exec, vivaldi
bind = SUPER, C, exec, ags request toggle-calc
bind = SUPER SHIFT, V, exec, firefox
bind = SUPER, F, fullscreen
bind = SUPER, X, killactive,
bind = SUPER, O, exec, obsidian --enable-features=UseOzonePlatform --ozone-platform=wayland
#bind = SUPER, M, exec, chromium --enable-feature=UseOzonePlatform --ozone-platform=wayland --kiosk music.amazon.com
bind = SUPER, R, exit,
bind = SUPER, L, exec, fuzzel
bind = SUPER, F7, exec, ~/nixos/home-manager/hyprland/hypr/scripts/refresh-rate.sh toggle
bind = SUPER, G, exec, bash -c 'grim -g "$(slurp)" - | tee ~/Pictures/$(date +"%Y-%m-%d_%H-%M-%S.png") | wl-copy --type image/png'
bind = SUPER SHIFT, G, exec, bash -c 'grim -g "$(slurp)" - | wl-copy --type image/png'
#bind = SUPER, E, exec, dolphin
#bind = SUPER, , togglefloating,

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, D, togglespecialworkspace, discord 
bind = SUPER, S, togglespecialworkspace, slack 
bind = SUPER, M, togglespecialworkspace, music
bind = SUPER, E, togglespecialworkspace, email
bind = SUPER, T, togglespecialworkspace, todo

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
# Volume control
binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
binde=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ --limit 1.0
bind=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=, XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness control
binde=, XF86MonBrightnessDown, exec, brightnessctl s 10%-
binde=, XF86MonBrightnessUp, exec, brightnessctl s +10%

# Example special workspace (scratchpad)
#bind = SUPER, S, togglespecialworkspace, magic
#bind = SUPER SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER SHIFT, mouse:273, resizewindow
